# Минимальный конфиг для лабы.
# Пароль передаётся из docker-compose через --requirepass (значение в .env),
# чтобы не хранить его в файле, который лежит в git.

port 6379
protected-mode yes

# Персистентность отключена — стенд одноразовый
save ""
appendonly no

# Логи в stdout, видно через docker compose logs redis
loglevel notice

# Задание: включи ACL и заведи пользователя только на чтение ключей cache:*
#   ACL SETUSER readonly on >readonly_pw ~cache:* +@read
#   ACL LIST
#   ACL WHOAMI
# Отдельно посмотри, что умеет дефолтный пользователь default и почему
# открытый наружу Redis без пароля — классика взломов.
