name: infosec-gitlab

# GitLab CE — то, что чаще встречается в компаниях, но требует ~4 ГБ RAM
# и поднимается 5–10 минут. Включай, когда доберёшься до заданий по правам в GitLab.
# Запуск:  docker compose -f compose.gitlab.yml up -d
# Веб:     http://localhost:8929
# Первый пароль root:
#   docker compose -f compose.gitlab.yml exec gitlab cat /etc/gitlab/initial_root_password

networks:
  lab:
    external: true
    name: infosec-lab

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.lab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 8
        prometheus_monitoring['enable'] = false
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-ChangeMe_GitLab123}
    ports:
      - "127.0.0.1:8929:8929"
      - "127.0.0.1:2224:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m
    networks:
      - lab
    restart: unless-stopped
