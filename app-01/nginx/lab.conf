server {
    listen 80 default_server;
    server_name app-01.lab localhost;

    root /var/www/html;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    listen 443 ssl default_server;
    server_name app-01.lab localhost;

    # Эти файлы кладёт entrypoint: либо самоподписанный (при первом старте),
    # либо выпущенный лабораторным УЦ. Меняются командой install-lab-cert.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    root /var/www/html;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
    }
}
